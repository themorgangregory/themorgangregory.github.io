# Build settings
markdown: kramdown
theme: minima # GitHub Pages default theme (we override with custom layouts/styles)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .gitignore